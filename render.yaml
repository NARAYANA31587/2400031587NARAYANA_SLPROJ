services:
  - type: web
    name: smartattendai-attendance
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    disk:
      name: smartattend-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SMARTATTEND_DATA_DIR
        value: /var/data
      - key: SMARTATTEND_SECRET
        generateValue: true
